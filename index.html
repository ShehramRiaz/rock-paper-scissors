<html lang="en">

<head>
    <!-- Basic Meta -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->

    <meta name="author" content="Shehram Riaz">
    <meta name="description"
        content="Play the classic Rock Paper Scissors game built using pure HTML, CSS, and JavaScript with interactive gameplay and a responsive design.">
    <meta name="keywords"
        content="rock paper scissors, javascript game, html css javascript, web game, frontend project, pure javascript">
    <meta name="robots" content="index, follow">

    <!-- Theme -->
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#ffffff">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Rock Paper Scissors">
    <meta property="og:description"
        content="A responsive Rock Paper Scissors game built using pure HTML, CSS, and JavaScript.">
    <meta property="og:url" content="https://shehramriaz.github.io/rock-paper-scissors/">
    <meta property="og:image" content="https://shehramriaz.github.io/rock-paper-scissors/images/icon.png">
    <meta property="og:image:alt" content="Rock Paper Scissors game preview">
    <meta property="og:site_name" content="Rock Paper Scissors">
    <meta property="og:locale" content="en_US">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Rock Paper Scissors">
    <meta name="twitter:description"
        content="A responsive Rock Paper Scissors game built using pure HTML, CSS, and JavaScript.">
    <meta name="twitter:image" content="https://shehramriaz.github.io/rock-paper-scissors/images/icon.png">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://shehramriaz.github.io/rock-paper-scissors/">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/icon.png">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/media.css">
</head>

<body>

    <header>
        <h1>Rock Paper Scissors</h1>
    </header>

    <main>
        <section id="choiceSection">
            <h2 class="visually-hidden">Select Your Choice</h2>

            <ul class="choice__list">
                <li class="choice__item">
                    <button type="button" class="choice__btn" data-choice="rock" aria-label="Choose Rock">
                        <img src="images/rock.png" alt="Rock" class="choice__image">
                    </button>
                </li>

                <li class="choice__item">
                    <button type="button" class="choice__btn" data-choice="paper" aria-label="Choose Paper">
                        <img src="images/paper.png" alt="paper" class="choice__image">
                    </button>
                </li>

                <li class="choice__item">
                    <button type="button" class="choice__btn" data-choice="scissors" aria-label="Choose Scissors">
                        <img src="images/scissors.png" alt="scissors" class="choice__image">
                    </button>
                </li>
            </ul>
        </section>

        <section id="scoreBoardSection">
            <h2 class="visually-hidden">Score Board</h2>

            <div class="score-board">
                <div class="score-board__user">
                    <h3 class="score-board__title">You</h3>
                    <output id="userScore" class="score-board__value" aria-live="polite">0</output>
                    <p id="userChoice" class="score-board__choice" aria-live="polite">No choice</p>
                </div>

                <div class="score-board__computer">
                    <h3 class="score-board__title">Computer</h3>
                    <output id="computerScore" class="score-board__value" aria-live="polite">0</output>
                    <p id="computerChoice" class="score-board__choice" aria-live="polite">No choice</p>
                </div>
            </div>
        </section>

        <p id="message" class="message" aria-live="polite">Ready? Choose your move!</p>
    </main>

    <footer class="footer">
        <p>© 2026 <strong>Shehram Riaz</strong></p>

        <a href="https://github.com/shehramriaz" target="_blank" rel="noopener noreferrer"
            aria-label="Visit my GitHub profile" class="footer__github">

    <script src="js/script.js"></script>
</body>
